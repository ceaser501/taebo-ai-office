name: Hugging Face 다시 빌드

# main 에 푸시하면 Hugging Face Space 를 새로 빌드해 최신 코드를 받게 한다.
# 레포 Settings → Secrets 에 HF_TOKEN(쓰기 권한), Variables 에 HF_SPACE(예: 계정/taebo-office)가 있어야 동작한다.
# 둘 중 하나라도 없으면 아무것도 하지 않고 성공으로 끝난다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Space 새로 빌드 요청
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN 또는 HF_SPACE 가 없어 건너뜁니다."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            "https://huggingface.co/api/spaces/$HF_SPACE/restart?factory=true")
          cat /tmp/out; echo
          echo "HTTP $code"
          test "$code" -lt 300
